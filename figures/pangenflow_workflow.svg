<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">PanGenFlow microbial genome curation funnel</title>
  <desc id="desc">A distinct curation-funnel diagram showing NCBI acquisition, GCA/GCF assembly-record reconciliation, metadata capture, CheckM2 quality filtering, optional FastANI relatedness checks, and curated analysis-ready genomes.</desc>
  <defs>
    <linearGradient id="top" x1="0" x2="1"><stop offset="0" stop-color="#0b3558"/><stop offset="1" stop-color="#0a8877"/></linearGradient>
    <linearGradient id="gate1" x1="0" x2="1"><stop offset="0" stop-color="#eaf5ff"/><stop offset="1" stop-color="#d9eefc"/></linearGradient>
    <linearGradient id="gate2" x1="0" x2="1"><stop offset="0" stop-color="#eaf9f5"/><stop offset="1" stop-color="#d8f1ea"/></linearGradient>
    <linearGradient id="gate3" x1="0" x2="1"><stop offset="0" stop-color="#f2f6fb"/><stop offset="1" stop-color="#e7eff7"/></linearGradient>
    <linearGradient id="gate4" x1="0" x2="1"><stop offset="0" stop-color="#eef9ef"/><stop offset="1" stop-color="#dff2e2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#143247" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#315b78"/></marker>
    <style>
      .h1{font:700 48px system-ui,-apple-system,Segoe UI,sans-serif;fill:#fff}
      .h2{font:700 25px system-ui,-apple-system,Segoe UI,sans-serif;fill:#143f5d}
      .body{font:400 18px system-ui,-apple-system,Segoe UI,sans-serif;fill:#486577}
      .small{font:400 16px system-ui,-apple-system,Segoe UI,sans-serif;fill:#5e7685}
      .label{font:700 16px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0a8877;letter-spacing:1px}
    </style>
  </defs>

  <rect width="1600" height="860" rx="26" fill="#ffffff"/>
  <rect x="40" y="36" width="1520" height="116" rx="28" fill="url(#top)"/>
  <circle cx="108" cy="94" r="41" fill="#fff" opacity="0.96"/>
  <path d="M88 67 C108 82 108 108 88 123 M128 67 C108 82 108 108 128 123" fill="none" stroke="#0a8877" stroke-width="5" stroke-linecap="round"/>
  <path d="M92 75 H124 M88 91 H128 M88 107 H128 M92 121 H124" stroke="#0b3558" stroke-width="3.5" stroke-linecap="round"/>
  <text x="172" y="92" class="h1">PanGenFlow</text>
  <text x="174" y="126" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="21" fill="#dcecf2">A curation funnel for defensible microbial genome cohorts</text>

  <!-- Left input card -->
  <g filter="url(#shadow)"><rect x="74" y="230" width="310" height="420" rx="26" fill="#f7fbff" stroke="#c9ddeb" stroke-width="2"/></g>
  <text x="110" y="275" class="label">START</text>
  <text x="110" y="316" class="h2">NCBI taxon query</text>
  <text x="110" y="353" class="body">Taxon name or taxid</text>
  <text x="110" y="385" class="body">Assembly source</text>
  <text x="110" y="417" class="body">Assembly level</text>
  <text x="110" y="449" class="body">Included file types</text>
  <text x="110" y="498" class="small">Large collections can use</text>
  <text x="110" y="524" class="small">dehydrated + rehydrated mode.</text>
  <rect x="110" y="562" width="238" height="52" rx="16" fill="#e8f3fb"/>
  <text x="229" y="594" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="650" fill="#2368a2">NCBI Datasets</text>

  <path d="M405 440 H490" stroke="#315b78" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Funnel -->
  <text x="760" y="205" text-anchor="middle" class="label">CURATION GATES</text>

  <g filter="url(#shadow)"><path d="M505 235 H1015 L970 330 H550 Z" fill="url(#gate1)" stroke="#bcd8ee" stroke-width="2"/></g>
  <text x="610" y="278" class="h2">1  Acquire</text>
  <text x="610" y="307" class="body">Filtered NCBI genome package + download manifest</text>

  <g filter="url(#shadow)"><path d="M550 345 H970 L925 440 H595 Z" fill="url(#gate2)" stroke="#b7dfd6" stroke-width="2"/></g>
  <text x="640" y="388" class="h2">2  Reconcile</text>
  <text x="640" y="417" class="body">Pair GCA/GCF assembly records; prefer current RefSeq when available</text>

  <g filter="url(#shadow)"><path d="M595 455 H925 L880 550 H640 Z" fill="url(#gate3)" stroke="#cad8e6" stroke-width="2"/></g>
  <text x="675" y="498" class="h2">3  Capture metadata</text>
  <text x="675" y="527" class="body">Assembly statistics, accession pairing, organism and annotation fields</text>

  <g filter="url(#shadow)"><path d="M640 565 H880 L835 660 H685 Z" fill="url(#gate4)" stroke="#b9dfbf" stroke-width="2"/></g>
  <text x="710" y="608" class="h2">4  Quality filter</text>
  <text x="710" y="637" class="body">CheckM2 completeness + contamination criteria</text>

  <path d="M835 613 H1030" stroke="#315b78" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Right output card -->
  <g filter="url(#shadow)"><rect x="1060" y="230" width="466" height="420" rx="26" fill="#f5fbf8" stroke="#b9dfc7" stroke-width="2"/></g>
  <text x="1100" y="275" class="label">HANDOFF</text>
  <text x="1100" y="316" class="h2">Curated genome cohort</text>
  <text x="1100" y="359" class="body">✓ traceable download settings</text>
  <text x="1100" y="393" class="body">✓ GCA/GCF-reconciled genome list</text>
  <text x="1100" y="427" class="body">✓ assembly metadata table</text>
  <text x="1100" y="461" class="body">✓ QC passed / failed lists</text>
  <text x="1100" y="495" class="body">✓ original-path mapping</text>
  <rect x="1100" y="540" width="382" height="76" rx="18" fill="#dff3e5"/>
  <text x="1291" y="570" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#2b7f49">Ready for downstream analysis</text>
  <text x="1291" y="598" text-anchor="middle" class="small">pangenomics · phylogenomics · AMR · custom workflows</text>

  <!-- Optional branch -->
  <path d="M760 667 V715" stroke="#d18a19" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="494" y="730" width="532" height="88" rx="22" fill="#fff7e8" stroke="#efd39c" stroke-width="2"/></g>
  <text x="530" y="764" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#9a650c">Optional FastANI branch</text>
  <text x="530" y="794" class="small">For sufficiently related genomes only; unreported comparisons remain NA.</text>

  <rect x="1060" y="690" width="466" height="128" rx="22" fill="#f7fafc" stroke="#d3e0e8" stroke-width="2"/>
  <text x="1096" y="726" class="label">BOUNDARY</text>
  <text x="1096" y="760" class="body">PanGenFlow prepares the cohort.</text>
  <text x="1096" y="790" class="body">It does not perform pangenome reconstruction.</text>
</svg>
